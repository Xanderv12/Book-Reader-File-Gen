<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Config Generator</title>
</head>
<body>
    <h2>Configuration Data (Web Interface)</h2>
    <form action="update.php" method="POST">
        <h3>Directory Information</h3>
        <label>Base Directory:</label><br>
        <input type="text" name="base_dir" required><br><br>

        <label>Second Directory:</label><br>
        <input type="text" name="second_dir" required><br><br>

        <label>Content Directory:</label><br>
        <input type="text" name="content_dir" required><br><br>

        <h3>Document Information</h3>
        <label>Title of Work:</label><br>
        <input type="text" name="title" required><br><br>

        <label>Number of Pages:</label><br>
        <input type="number" name="pages" required><br><br>

        <label>Height of Scans:</label><br>
        <input type="number" name="height" required><br><br>

        <label>Width of Scans:</label><br>
        <input type="number" name="width" required><br><br>

        <label>Base Filename:</label><br>
        <input type="text" name="base" required><br><br>

        <button type="submit">Save Configuration & Run</button>
    </form>
</body>
</html>
